[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta:__"

[project]
name = "promptguard"
version = "0.2.0"
description = "Provider-agnostic prompt precompiler — security and guardrails for AI-assisted development"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "security", "llm", "guardrails", "copilot", "claude", "proxy"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
promptguard = "promptguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptguard*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
