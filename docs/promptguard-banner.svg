<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a884;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)" rx="12"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="1" fill="none">
    <line x1="0" y1="0" x2="0" y2="200"/>
    <line x1="50" y1="0" x2="50" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="0" y1="0" x2="900" y2="0"/>
    <line x1="0" y1="50" x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
  </g>

  <!-- Shield icon group -->
  <g transform="translate(38, 14)">
    <!-- Shield base (wider) -->
    <path d="M0 0 L95 0 L95 88 Q95 120 47.5 160 Q0 120 0 88 Z"
          fill="none" stroke="url(#shieldGrad)" stroke-width="3.5" opacity="0.4"/>
    <!-- Shield filled -->
    <path d="M10 10 L85 10 L85 84 Q85 110 47.5 144 Q10 110 10 84 Z"
          fill="url(#shieldGrad)" opacity="0.15"/>
    <!-- Shield inner accent -->
    <path d="M20 20 L75 20 L75 80 Q75 102 47.5 132 Q20 102 20 80 Z"
          fill="none" stroke="url(#shieldGrad)" stroke-width="2" opacity="0.6"/>

    <!-- Code brackets inside shield -->
    <g transform="translate(47.5, 82)" filter="url(#glow)">
      <polyline points="-18,-22 -30,0 -18,22"
                fill="none" stroke="#00d4aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="18,-22 30,0 18,22"
                fill="none" stroke="#00d4aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Center slash -->
      <line x1="-6" y1="28" x2="6" y2="-28"
            stroke="#00d4aa" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>

  <!-- Vertical divider -->
  <line x1="200" y1="30" x2="200" y2="170" stroke="#30363d" stroke-width="1"/>

  <!-- Text: PromptGuard -->
  <text x="225" y="105"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" fill="#e6edf3" letter-spacing="-1">
    PromptGuard
  </text>

  <!-- Tagline -->
  <text x="228" y="138"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18" font-weight="400" fill="#c9d1d9" letter-spacing="0.5">
    Prompt Security for AI Coding Assistants
  </text>

  <!-- Decorative dots / nodes (network / connections feel) -->
  <g opacity="0.4">
    <circle cx="730" cy="50" r="3" fill="#00d4aa"/>
    <circle cx="760" cy="72" r="2.5" fill="#00d4aa"/>
    <circle cx="788" cy="48" r="2" fill="#00d4aa"/>
    <circle cx="810" cy="80" r="3" fill="#00d4aa"/>
    <circle cx="745" cy="95" r="2" fill="#00d4aa"/>
    <circle cx="778" cy="105" r="2.5" fill="#00d4aa"/>
    <line x1="730" y1="50" x2="760" y2="72" stroke="#00d4aa" stroke-width="1" opacity="0.4"/>
    <line x1="760" y1="72" x2="788" y2="48" stroke="#00d4aa" stroke-width="1" opacity="0.4"/>
    <line x1="788" y1="48" x2="810" y2="80" stroke="#00d4aa" stroke-width="1" opacity="0.4"/>
    <line x1="745" y1="95" x2="778" y2="105" stroke="#00d4aa" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Shield checkmark at bottom right -->
  <g transform="translate(860, 155)">
    <path d="M0 5 L8 5 L8 22 Q8 28 4 32 Q0 28 0 22 Z"
          fill="#00d4aa" opacity="0.2"/>
    <polyline points="2,18 6,22 14,10"
              fill="none" stroke="#00d4aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>
</svg>