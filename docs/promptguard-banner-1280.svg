<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="256" y1="0" x2="256" y2="640"/>
    <line x1="512" y1="0" x2="512" y2="640"/>
    <line x1="768" y1="0" x2="768" y2="640"/>
    <line x1="1024" y1="0" x2="1024" y2="640"/>
  </g>

  <!-- Shield base -->
  <g transform="translate(60, 160)">
    <!-- Outer shield glow -->
    <path d="M80,0 L160,0 L160,50 C160,90 130,130 80,160 C30,130 0,90 0,50 L0,0 Z"
          fill="url(#shield)" stroke="#00d4aa" stroke-width="2" stroke-opacity="0.4" filter="url(#glow)"/>
    <!-- Inner shield -->
    <path d="M80,10 L150,10 L150,50 C150,82 124,116 80,142 C36,116 10,82 10,50 L10,10 Z"
          fill="none" stroke="#00d4aa" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Code brackets -->
    <text x="80" y="108" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, monospace"
          font-size="62" font-weight="700" fill="#00d4aa" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Title -->
  <text x="310" y="265" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, sans-serif"
        font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-1">PromptGuard</text>

  <!-- Tagline -->
  <text x="310" y="330" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, sans-serif"
        font-size="26" font-weight="400" fill="#00d4aa" letter-spacing="1">PROMPT SECURITY FOR AI CODING ASSISTANTS</text>

  <!-- Bottom accent line -->
  <rect x="310" y="355" width="480" height="2" rx="1" fill="#00d4aa" fill-opacity="0.4"/>
</svg>